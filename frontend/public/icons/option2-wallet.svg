<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="walletMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Wallet Flap Gradient -->
    <linearGradient id="walletFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Bank Card 1 Gradient (MB Bank Purple/Blue & Gold vibe, modernized to Emerald-Teal) -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Bank Card 2 Gradient (Gold Premium Card) -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow2" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad2)" stroke="#34d399" stroke-opacity="0.2" stroke-width="4" />
  
  <!-- Subtle organic background curves (Ruộng bậc thang / đồi xanh) -->
  <path d="M 16 380 Q 140 330 260 360 T 496 340 L 496 496 L 16 496 Z" fill="#022c22" opacity="0.4" />
  <path d="M 16 420 Q 180 380 320 410 T 496 390 L 496 496 L 16 496 Z" fill="#011b15" opacity="0.5" />

  <!-- MAIN WALLET CONTAINER -->
  <g filter="url(#shadow2)">
    <!-- BACK CARD 2 (Gold Ledger / Card thò ra) -->
    <rect x="156" y="100" width="200" height="120" rx="18" fill="url(#cardGrad2)" stroke="#fef08a" stroke-width="2" transform="rotate(-6 256 160)" />
    <!-- Card 2 chip -->
    <rect x="180" y="125" width="28" height="22" rx="4" fill="#78350f" opacity="0.4" transform="rotate(-6 256 160)" />
    
    <!-- FRONT CARD 1 (MB Bank / FinTech Teal Card thò ra) -->
    <rect x="160" y="118" width="205" height="120" rx="18" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" transform="rotate(4 256 175)" />
    <!-- Chip EMV -->
    <rect x="185" y="145" width="32" height="24" rx="5" fill="#fef08a" stroke="#d97706" stroke-width="1.5" transform="rotate(4 256 175)" />
    <!-- Card Contactless Lines -->
    <path d="M 330 145 A 12 12 0 0 1 330 165 M 338 140 A 18 18 0 0 1 338 170" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" transform="rotate(4 256 175)" />

    <!-- WALLET MAIN BODY (Thân ví bo tròn) -->
    <rect x="106" y="180" width="300" height="210" rx="36" fill="url(#walletMain)" stroke="#34d399" stroke-opacity="0.4" stroke-width="3" />
    
    <!-- Đường vân may da ví (Stitching lines) -->
    <rect x="116" y="190" width="280" height="190" rx="28" fill="none" stroke="#6ee7b7" stroke-dasharray="8 6" stroke-width="2" opacity="0.45" />

    <!-- Ruộng bậc thang trên thân ví (Embossed Farm Lines) -->
    <path d="M 120 320 C 180 300 240 330 300 310 C 340 296 370 305 386 312" stroke="#064e3b" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6" />
    <path d="M 120 345 C 190 325 250 355 310 335 C 350 322 375 330 386 336" stroke="#064e3b" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6" />

    <!-- WALLET FRONT FLAP (Nắp ví) -->
    <path d="M 106 180 L 406 180 C 406 180 380 280 256 280 C 132 280 106 180 106 180 Z" fill="url(#walletFlap)" stroke="#6ee7b7" stroke-width="2" />
    <!-- Flap stitch -->
    <path d="M 120 190 C 136 260 190 266 256 266 C 322 266 376 260 392 190" fill="none" stroke="#a7f3d0" stroke-dasharray="6 5" stroke-width="2" opacity="0.6" />

    <!-- GOLDEN CLASP BADGE (Khóa chốt ví hình Mầm Cây Vàng HT FARM) -->
    <circle cx="256" cy="278" r="38" fill="url(#goldBadge)" stroke="#fde047" stroke-width="3" filter="url(#glow2)" />
    <circle cx="256" cy="278" r="30" fill="#042f24" />

    <!-- Biểu tượng mầm lá vàng khắc trong chốt ví -->
    <path d="M 256 295 Q 255 272 258 266" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
    <path d="M 256 284 C 242 280 236 266 242 260 C 252 260 256 274 256 284 Z" fill="url(#goldBadge)" />
    <path d="M 257 276 C 265 268 276 262 274 254 C 264 254 258 266 257 276 Z" fill="url(#goldBadge)" />
  </g>

  <!-- Lấp lánh tài lộc -->
  <path d="M 390 195 Q 390 205 400 205 Q 390 205 390 215 Q 390 205 380 205 Q 390 205 390 195 Z" fill="#fef08a" filter="url(#glow2)" />

  <!-- Bottom Label -->
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#a7f3d0" letter-spacing="4" opacity="0.9">VÍ CHI TIÊU HT</text>
</svg>