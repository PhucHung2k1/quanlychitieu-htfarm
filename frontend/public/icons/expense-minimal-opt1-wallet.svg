<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Nền trắng viền bo góc bo tròn mềm kiểu Trace -->
  <rect x="28" y="28" width="456" height="456" rx="136" fill="#ffffff" stroke="#99f6e4" stroke-width="12" />
  
  <!-- Thẻ chi tiêu thò ra từ ví (Tilted Card) màu Cyan -->
  <rect x="175" y="130" width="170" height="120" rx="24" fill="#22d3ee" transform="rotate(-8 260 190)" />

  <!-- Thân ví phẳng bo tròn hiện đại (Wallet Body) màu Teal ngọc -->
  <rect x="136" y="195" width="240" height="180" rx="40" fill="#0d9488" />

  <!-- Nắp / ngăn kẹp thẻ của ví (Card Slot Flap) màu ngọc bích sáng -->
  <path d="M 136 245 C 190 275 322 275 376 245 L 376 335 C 376 357 358 375 336 375 L 176 375 C 154 375 136 357 136 335 Z" fill="#0f766e" />

  <!-- Khuy chốt ví tối giản dạng chấm trắng tròn -->
  <circle cx="256" cy="275" r="14" fill="#ffffff" />
</svg>