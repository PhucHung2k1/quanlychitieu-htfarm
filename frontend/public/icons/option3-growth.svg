<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Trendline Arrow Gold Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leaf3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Shadow and Glow Filters -->
    <filter id="shadow3" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad3)" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />

  <!-- Lưới tọa độ tài chính mờ tinh tế (Grid lines) -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />
  <line x1="80" y1="300" x2="432" y2="300" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="80" y1="220" x2="432" y2="220" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="80" y1="140" x2="432" y2="140" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- BAR CHART COLUMNS -->
  <g filter="url(#shadow3)">
    <!-- Column 1 (Thu nhập/Đầu tư khởi điểm) -->
    <rect x="120" y="270" width="68" height="110" rx="16" fill="url(#bar1Grad)" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Column 2 (Tăng trưởng dòng tiền) -->
    <rect x="222" y="210" width="68" height="170" rx="16" fill="url(#bar2Grad)" stroke="#6ee7b7" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Column 3 (Đỉnh cao lợi nhuận & tài sản nông trại) -->
    <rect x="324" y="140" width="68" height="240" rx="16" fill="url(#bar3Grad)" stroke="#a7f3d0" stroke-width="2.5" />

    <!-- Đỉnh cột 3: Chồi mầm cây vươn lên đón nắng -->
    <path d="M 358 140 Q 358 95 372 65" stroke="#34d399" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Lá mầm trái -->
    <path d="M 358 115 C 330 110 305 85 315 60 C 335 60 355 85 358 110 Z" fill="url(#leaf3Grad)" filter="url(#arrowGlow)" />
    <!-- Lá mầm phải -->
    <path d="M 364 95 C 385 85 415 65 415 40 C 390 40 368 65 364 95 Z" fill="url(#leaf3Grad)" filter="url(#arrowGlow)" />
  </g>

  <!-- MŨI TÊN DÒNG TIỀN TĂNG TRƯỞNG (GROWTH TRENDLINE) -->
  <g filter="url(#arrowGlow)">
    <!-- Đèn chiếu sáng / vệt sáng sau mũi tên -->
    <path d="M 95 365 C 160 340 190 290 256 250 C 320 210 370 140 415 95" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.35" />
    
    <!-- Đường mũi tên chính (Solid Trendline) -->
    <path d="M 95 365 C 160 340 190 290 256 250 C 320 210 370 140 415 95" fill="none" stroke="url(#trendGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Đầu mũi tên mạ vàng (Arrowhead) -->
    <polygon points="415,75 425,108 395,98" fill="url(#trendGrad)" stroke="#fffbeb" stroke-width="2" stroke-linejoin="round" />

    <!-- Điểm nút dữ liệu phát sáng trên biểu đồ (Glowing data points) -->
    <circle cx="154" cy="315" r="7" fill="#fef08a" stroke="#d97706" stroke-width="2.5" />
    <circle cx="256" cy="250" r="7" fill="#fef08a" stroke="#d97706" stroke-width="2.5" />
    <circle cx="358" cy="155" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Ngôi sao thành công -->
  <path d="M 435 55 Q 435 68 448 68 Q 435 68 435 81 Q 435 68 422 68 Q 435 68 435 55 Z" fill="#fef08a" filter="url(#arrowGlow)" />

  <!-- Dòng chữ định danh -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#a7f3d0" letter-spacing="4" opacity="0.9">KẾ TOÁN & TĂNG TRƯỞNG</text>
</svg>