<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Nền trắng viền bo góc bo tròn mềm kiểu Trace -->
  <rect x="28" y="28" width="456" height="456" rx="136" fill="#ffffff" stroke="#99f6e4" stroke-width="12" />

  <!-- DÒNG TIỀN THU (INFLOW - Mũi tên bo tròn hướng lên màu Teal ngọc) -->
  <g>
    <!-- Thân mũi tên Thu (Nghiêng 45 độ lên phải) -->
    <path d="M 195 330 L 305 220" stroke="#0d9488" stroke-width="48" stroke-linecap="round" />
    <!-- Đầu mũi tên Thu -->
    <path d="M 225 210 L 315 210 L 315 300" fill="none" stroke="#0d9488" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- DÒNG TIỀN CHI (OUTFLOW - Mũi tên bo tròn hướng xuống màu Cyan sáng) -->
  <g opacity="0.95">
    <!-- Thân mũi tên Chi (Nghiêng 45 độ xuống trái) -->
    <path d="M 315 185 L 205 295" stroke="#22d3ee" stroke-width="38" stroke-linecap="round" />
    <!-- Đầu mũi tên Chi -->
    <path d="M 285 305 L 195 305 L 195 215" fill="none" stroke="#22d3ee" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>