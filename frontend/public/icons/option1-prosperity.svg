<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#043c2e" />
      <stop offset="100%" stop-color="#022119" />
    </linearGradient>
    
    <radialGradient id="ambientGlow1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldCoinTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leafGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="leafGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow1" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad1)" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ambientGlow1)" />

  <!-- Outer Golden Ring / Shield Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad1)" stroke-width="3" stroke-dasharray="16 8" opacity="0.35" />
  <circle cx="256" cy="256" r="176" fill="#042f24" fill-opacity="0.6" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- STACKED GOLD COINS (Nền tảng tài chính vững chắc) -->
  <g filter="url(#shadow1)">
    <!-- Bottom Coin -->
    <path d="M 166 375 C 166 360 206 350 256 350 C 306 350 346 360 346 375 L 346 395 C 346 410 306 420 256 420 C 206 420 166 410 166 395 Z" fill="#b45309" />
    <ellipse cx="256" cy="375" rx="90" ry="22" fill="url(#goldCoinTop)" stroke="#fef08a" stroke-width="2" />
    
    <!-- Middle Coin -->
    <path d="M 176 345 C 176 332 212 322 256 322 C 300 322 336 332 336 345 L 336 362 C 336 375 300 385 256 385 C 212 385 176 375 176 362 Z" fill="#d97706" />
    <ellipse cx="256" cy="345" rx="80" ry="20" fill="url(#goldCoinTop)" stroke="#fef08a" stroke-width="2" />

    <!-- Top Coin -->
    <path d="M 186 315 C 186 304 217 295 256 295 C 295 295 326 304 326 315 L 326 330 C 326 341 295 350 256 350 C 217 350 186 341 186 330 Z" fill="#f59e0b" />
    <ellipse cx="256" cy="315" rx="70" ry="18" fill="url(#goldGrad1)" stroke="#fffbeb" stroke-width="2" />
  </g>

  <!-- MẦM CÂY HT FARM (Đâm chồi từ đồng tiền tài chính) -->
  <g filter="url(#shadow1)">
    <!-- Thân cây chính -->
    <path d="M 256 315 Q 254 240 262 195" stroke="#34d399" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Lá mầm bên trái -->
    <path d="M 255 255 C 220 250 160 215 160 165 C 190 155 245 190 255 240 Z" fill="url(#leafGradLeft)" />
    <!-- Gân lá trái -->
    <path d="M 253 243 C 225 215 190 185 175 175" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- Lá mầm bên phải vươn cao (Tượng trưng tăng trưởng) -->
    <path d="M 258 225 C 285 210 355 160 345 105 C 300 100 255 165 258 225 Z" fill="url(#leafGradRight)" />
    <!-- Gân lá phải -->
    <path d="M 260 215 C 285 175 320 135 335 120" stroke="#ecfdf5" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- BIỂU TƯỢNG ĐỒNG TIỀN / CHIP CÔNG NGHỆ NHỎ -->
  <circle cx="256" cy="315" r="7" fill="#fef08a" filter="url(#glowGold)" />

  <!-- NGÔI SAO TÀI CHÍNH LẤP LÁNH (AI / THỊNH VƯỢNG) -->
  <g filter="url(#glowGold)">
    <!-- Top-Right Sparkle -->
    <path d="M 370 120 Q 370 135 385 135 Q 370 135 370 150 Q 370 135 355 135 Q 370 135 370 120 Z" fill="#fef08a" />
    <circle cx="370" cy="135" r="2.5" fill="#ffffff" />

    <!-- Left Small Sparkle -->
    <path d="M 145 190 Q 145 200 155 200 Q 145 200 145 210 Q 145 200 135 200 Q 145 200 145 190 Z" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Chữ tắt tinh tế: HT FARM (Khắc chìm chân icon) -->
  <text x="256" y="462" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#a7f3d0" letter-spacing="6" opacity="0.85">HT FARM</text>
</svg>