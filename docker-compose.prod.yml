services:
  postgres:
    image: postgres:16-alpine
    container_name: htfarm-chitieu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-quanlychitieu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quanlychitieu}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: htfarm-chitieu-redis
    restart: always
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: htfarm-chitieu-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3002:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: htfarm-chitieu-frontend
    restart: always
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
  redisdata:
  uploads_data:
